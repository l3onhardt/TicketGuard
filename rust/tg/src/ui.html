<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>票审 · 配电工作票预审</title>
<style>
* {box-sizing: border-box;}
body {margin: 0; background: #f5f7fa; color: #1f2933; font: 16px/1.7 "Microsoft YaHei", "PingFang SC", sans-serif;}
body.fixed {overflow: hidden;}
button, textarea, input {font: inherit; color: inherit;}
p {margin: 0 0 .75rem;}
h2 {margin: 0 0 .75rem; font-size: 1.15rem;}
.muted {color: #52606d; font-size: .875rem;}

.top {background: #102a43; color: #fff; padding: 0 1.25rem; overflow: hidden; height: 3.4rem; line-height: 3.4rem;}
.top h1 {float: left; margin: 0 2rem 0 0; font-size: 1.15rem;}
.top .nav {float: left;}
.top .nav button {background: transparent; border: 0; border-bottom: 3px solid transparent; color: #bcccdc; height: 3.4rem; padding: 0 1rem; cursor: pointer;}
.top .nav button.on {color: #fff; border-bottom-color: #fff;}
.top .right {float: right; font-size: .875rem; color: #bcccdc;}
.top .right button {margin-left: 1rem; background: transparent; color: #fff; border: 1px solid #829ab1; padding: .1rem .9rem; line-height: 1.7; cursor: pointer;}
.top button:hover {background: #243b53;}

main {display: block; max-width: 60rem; margin: 1.5rem auto; padding: 0 1rem;}
.card {background: #fff; border: 1px solid #d9e2ec; padding: 1.5rem; margin-bottom: 1.25rem;}
.btn {display: inline-block; background: #fff; border: 1px solid #9fb3c8; padding: .35rem 1rem; cursor: pointer;}
.btn:hover {background: #f0f4f8;}
.btn[disabled] {color: #9fb3c8; cursor: default;}
.primary {background: #1d4ed8; border-color: #1d4ed8; color: #fff; font-size: 1.1rem; padding: .6rem 2.5rem;}
.primary:hover {background: #1e40af;}
.primary[disabled] {background: #9fb3c8; border-color: #9fb3c8; color: #fff;}
.warn {background: #fff7ed; border-left: 6px solid #b45309; padding: .75rem 1rem; margin: .75rem 0 0;}

/* 放入票面 */
#text {display: block; width: 100%; height: 16rem; padding: .75rem; border: 1px solid #9fb3c8; resize: vertical; line-height: 1.5; font-size: .95rem; background: #fff;}
#text.over {border: 2px dashed #1d4ed8; background: #eff6ff;}
.row {margin-top: .75rem;}
#picker {display: none;}
.chip {display: inline-block; margin: .25rem .5rem .25rem 0; padding: .15rem .75rem; border: 1px solid #bcccdc; background: #f0f4f8; font-size: .875rem;}
.chip button {border: 0; background: transparent; cursor: pointer; color: #52606d; padding: 0 0 0 .5rem;}
a.example {display: inline-block; margin: .15rem 1rem .15rem 0; color: #1d4ed8; cursor: pointer; text-decoration: underline; font-size: .875rem;}
#go-row {text-align: center; margin: 1.5rem 0 .5rem;}
.how {max-width: 44rem; margin: 1rem auto 0; text-align: left;}

/* 流水线的三步 */
.steps {display: table; width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: .6rem 0; margin: 0 -.6rem;}
.step {display: table-cell; vertical-align: top; background: #fff; border: 1px solid #d9e2ec; border-top: 4px solid #bcccdc; padding: .6rem .9rem;}
.step small {display: block; color: #52606d; font-size: .8rem;}
.step b {display: block; font-size: 1rem; line-height: 1.5;}
.step span {display: block; font-size: .875rem; color: #52606d; line-height: 1.5;}
.step.doing {border-top-color: #1d4ed8;}
.step.ok {border-top-color: #15803d;}
.step.skip {border-top-color: #829ab1;}
.step.bad {border-top-color: #b45309;}
.step.issues {border-top-color: #b45309; background: #fff7ed;}
.step.no_scenario {border-top-color: #52606d; background: #f0f4f8;}
.step.notes {border-top-color: #1d4ed8; background: #eff6ff;}
.step.clear {border-top-color: #15803d; background: #f0fdf4;}

/* 结果 */
#results {display: none;}
#bar {background: #fff; border-bottom: 1px solid #d9e2ec; padding: .5rem 1.25rem; overflow: hidden;}
#bar .btn {float: left; margin-right: 1rem;}
#bar p {margin: 0; line-height: 2.3rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;}
#list {float: left; width: 17rem; padding: 1rem 0 1rem 1rem; overflow-y: auto;}
#pane {padding: 1rem;}
#pane.with-list {margin-left: 17rem;}
#frame {display: block; width: 100%; border: 1px solid #d9e2ec; background: #fff; margin-top: .75rem;}
#message {display: none; background: #fff; border: 1px solid #d9e2ec; padding: 1.5rem; margin-top: .75rem;}
.item {background: #fff; border: 1px solid #d9e2ec; border-left: 6px solid #9fb3c8; padding: .6rem .75rem; margin-bottom: .6rem; cursor: pointer; word-wrap: break-word;}
.item.sel {outline: 2px solid #1d4ed8;}
.item b {display: block; font-size: .95rem;}
.item span {display: block; font-size: .875rem; color: #52606d;}
.item.issues {border-left-color: #b45309;}
.item.no_scenario {border-left-color: #52606d;}
.item.notes {border-left-color: #1d4ed8;}
.item.clear {border-left-color: #15803d;}
.item.failed {border-left-color: #b42318;}

/* 准确度 */
#accuracy {display: none;}
.meters {width: 100%; border-collapse: collapse; margin: .75rem 0 0;}
.meters td {padding: .55rem 0; vertical-align: middle; border-top: 1px solid #e6ecf2;}
.meters .name {width: 38%; padding-right: 1rem;}
.meters .figure {width: 11.5rem; padding-left: 1rem; text-align: right; white-space: nowrap;}
.meters .figure b {font-size: 1.15rem;}
.meters .figure small {color: #52606d; font-size: .875rem; margin-left: .4rem;}
.track {height: .75rem; background: #e6ecf2; border-radius: 4px; overflow: hidden;}
.fill {height: .75rem; background: #1d4ed8; border-radius: 4px;}
.fill.wrong {background: #b45309;}
.meters .note td {border-top: 0; padding: 0 0 .6rem; color: #52606d; font-size: .875rem;}
.verdict-word {display: inline-block; font-size: .8rem; color: #52606d; margin-left: .4rem;}
ul.plain {margin: 0; padding-left: 1.25rem;}
ul.plain li {margin-bottom: .4rem;}

#gone {display: none; max-width: 40rem; margin: 5rem auto; text-align: center;}
@media (max-width: 52rem) {
  #list {float: none; width: auto; max-height: 11rem; padding: 1rem 1rem 0;}
  #pane.with-list {margin-left: 0;}
  .steps, .step {display: block; margin: 0;}
  .step {margin-bottom: .5rem;}
  .meters .name {width: 45%;}
  .meters .figure {width: 7.5rem;}
  .meters .figure small {display: block; margin: 0;}
}
</style>
</head>
<body>
<div class="top">
  <h1>票审</h1>
  <div class="nav" id="nav">
    <button type="button" id="nav-check" class="on">预审</button>
    <button type="button" id="nav-accuracy">准确度</button>
  </div>
  <div class="right"><span id="version"></span><button type="button" id="quit">退出票审</button></div>
</div>

<main id="input">
  <div class="card">
    <h2>放入票面</h2>
    <textarea id="text" placeholder="把工作票的票面全文粘贴到这里（在系统里全选、复制，到这里粘贴）。&#10;&#10;也可以把 .txt 文件拖到这个框里。"></textarea>
    <div class="row">
      <button type="button" class="btn" id="pick">选择 .txt 文件…</button>
      <input type="file" id="picker" accept=".txt,text/plain" multiple>
      <span class="muted">可以一次选几张。</span>
    </div>
    <div class="row" id="files"></div>
    <p class="warn" id="file-error" style="display:none"></p>
    <div class="row" id="examples-row" style="display:none">
      <span class="muted">手头没有票？点一张编造的示例票试一试：</span><br><span id="examples"></span>
    </div>
  </div>

  <div id="go-row">
    <button type="button" class="btn primary" id="go" disabled>开始预审</button>
    <p class="muted" id="go-hint" style="margin-top:.5rem">先粘贴票面，或者选择文件。</p>
  </div>

  <div class="how">
    <div class="steps">
      <div class="step"><small>第一步</small><b>规则检查</b><span>人数、时间、地点、签名；对照典票逐栏比安全措施。一两秒。</span></div>
      <div class="step"><small>第二步</small><b>模型复核</b><span id="how-model"></span></div>
      <div class="step"><small>第三步</small><b>结论</b><span>列出需要你看的疑点，每条附依据，并写好打回意见草稿。</span></div>
    </div>
    <p class="muted" style="margin-top:1rem">只做预审建议：是否接收或打回由审票人决定。票面只在这台电脑上处理，不联网。这两步在考题上的成绩见上方“准确度”。</p>
  </div>
</main>

<div id="results">
  <div id="bar">
    <button type="button" class="btn" id="again">← 再审一张</button>
    <button type="button" class="btn" id="open">在新窗口打开这份报告</button>
    <p class="muted" id="saved"></p>
  </div>
  <div id="list"></div>
  <div id="pane">
    <div class="steps" id="steps">
      <div class="step" id="step1"><small>第一步　规则检查</small><b></b><span></span></div>
      <div class="step" id="step2"><small>第二步　模型复核</small><b></b><span></span></div>
      <div class="step" id="step3"><small>第三步　结论</small><b></b><span></span></div>
    </div>
    <div id="message"></div>
    <iframe id="frame" title="预审报告"></iframe>
  </div>
</div>

<main id="accuracy">
  <div class="card">
    <h2>机器有多准</h2>
    <p>单看一张真实的票，机器没法知道自己对不对。所以拿一批<b>知道正确答案的考题</b>让它做：先过规则，再过模型，数它对了多少。下面是成绩单。</p>
    <p class="muted" id="accuracy-meta"></p>
  </div>
  <div id="accuracy-body"></div>
</main>

<div id="gone" class="card"><h2 id="gone-title"></h2><p id="gone-text"></p></div>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function show(id, on) { $(id).style.display = on ? "block" : "none"; }
  function setText(node, value) { node.innerHTML = ""; node.appendChild(document.createTextNode(value)); }
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) { node.className = className; }
    if (text !== undefined) { node.appendChild(document.createTextNode(text)); }
    return node;
  }

  var files = [];        // 选中或拖进来的文件：{name, text}
  var jobs = [];         // 这一批票：{name, text, state, rule, final, error, modelError, seconds}
  var selected = -1;
  var modelState = "missing";
  var modelNote = "";
  var timer = null;
  var closed = false;
  var view = "input";    // 预审这一页现在显示的是 input 还是 results
  var accuracyLoaded = false;

  // 所有请求都发给这个页面自己所在的地址（本机），相对路径里已经带着这次运行的口令
  function call(method, path, body, done) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, path, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) { return; }
      if (xhr.status === 0) { gone("票审已经关闭", "那个黑色的窗口被关掉了，或者程序已经退出。要继续用，请重新双击“票审.exe”。"); return; }
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
      if (xhr.status !== 200 || data === null) { done({ok: false, error: xhr.responseText || ("程序返回了状态码 " + xhr.status)}); return; }
      done(data);
    };
    if (body === null) { xhr.send(); } else { xhr.setRequestHeader("Content-Type", "application/json; charset=utf-8"); xhr.send(JSON.stringify(body)); }
  }

  function gone(title, text) {
    if (closed) { return; }
    closed = true;
    if (timer) { clearInterval(timer); }
    show("input", false); show("results", false); show("accuracy", false); show("gone", true);
    document.body.className = "";
    $("quit").style.display = "none"; $("nav").style.display = "none";
    setText($("gone-title"), title); setText($("gone-text"), text);
  }

  // ---------- 页面切换 ----------
  function showView(name) {
    show("input", name === "input"); show("results", name === "results"); show("accuracy", name === "accuracy");
    document.body.className = name === "results" ? "fixed" : "";
    $("nav-check").className = name === "accuracy" ? "" : "on";
    $("nav-accuracy").className = name === "accuracy" ? "on" : "";
    if (name !== "accuracy") { view = name; }
    if (name === "results") { layout(); }
  }
  $("nav-check").onclick = function () { showView(view); };
  $("nav-accuracy").onclick = function () { showView("accuracy"); loadAccuracy(); };

  // ---------- 放入票面 ----------
  function refreshGo() {
    var count = files.length + ($("text").value.replace(/\s/g, "") ? 1 : 0);
    $("go").disabled = count === 0;
    setText($("go-hint"), count === 0 ? "先粘贴票面，或者选择文件。" : "共 " + count + " 张票。");
  }

  function drawFiles() {
    var box = $("files");
    box.innerHTML = "";
    for (var i = 0; i < files.length; i++) {
      var chip = el("span", "chip", files[i].name);
      var remove = el("button", "", "×");
      remove.type = "button";
      remove.setAttribute("aria-label", "去掉 " + files[i].name);
      remove.setAttribute("data-index", String(i));
      remove.onclick = function () { files.splice(Number(this.getAttribute("data-index")), 1); drawFiles(); };
      chip.appendChild(remove);
      box.appendChild(chip);
    }
    refreshGo();
  }

  function fileError(text) { setText($("file-error"), text); show("file-error", text !== ""); }

  // 记事本存的文件可能是 UTF-8，也可能是 ANSI（GBK）。先按 UTF-8 读，读出乱码再按 GBK 读。
  function readFile(file, encoding) {
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result);
      if (encoding === "utf-8" && text.indexOf("�") >= 0) { readFile(file, "gbk"); return; }
      if (text.charAt(0) === "﻿") { text = text.substring(1); }
      if (!text.replace(/\s/g, "")) { fileError(file.name + " 是空的。"); return; }
      files.push({name: file.name, text: text});
      drawFiles();
    };
    reader.onerror = function () { fileError(file.name + " 读不出来。"); };
    reader.readAsText(file, encoding);
  }

  function addFiles(list) {
    fileError("");
    for (var i = 0; i < list.length; i++) {
      if (!/\.txt$/i.test(list[i].name)) {
        fileError("“" + list[i].name + "”不是 .txt 文件。Word、Excel、PDF 现在还不能直接读：请打开它，全选、复制，粘贴到上面的框里。");
        continue;
      }
      readFile(list[i], "utf-8");
    }
  }

  $("pick").onclick = function () { $("picker").click(); };
  $("picker").onchange = function () { addFiles(this.files); this.value = ""; };
  $("text").onkeyup = refreshGo;
  $("text").onchange = refreshGo;
  $("text").onpaste = function () { setTimeout(refreshGo, 0); };
  $("text").ondragover = function (event) { event.preventDefault(); this.className = "over"; };
  $("text").ondragleave = function () { this.className = ""; };
  $("text").ondrop = function (event) {
    this.className = "";
    if (event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files.length) {
      event.preventDefault();
      addFiles(event.dataTransfer.files);
    } else { setTimeout(refreshGo, 0); }
  };
  // 文件没拖准、落在框外面时，不要让浏览器把这个页面换成那个文件
  document.ondragover = function (event) { event.preventDefault(); };
  document.ondrop = function (event) { event.preventDefault(); };

  function drawExamples(list) {
    if (!list.length) { return; }
    show("examples-row", true);
    for (var i = 0; i < list.length; i++) {
      var link = el("a", "example", list[i].name.replace(/\.txt$/i, ""));
      link.setAttribute("data-index", String(i));
      link.onclick = function () { $("text").value = list[Number(this.getAttribute("data-index"))].text; refreshGo(); $("text").scrollTop = 0; };
      $("examples").appendChild(link);
    }
  }

  function applyStatus(status) {
    setText($("version"), "版本 " + status.version);
    modelState = status.model;
    modelNote = status.model_note;
    var text = "规则报了“可能缺少措施”才做：请这台电脑上的小模型看票面上是不是其实写了、只是写法和典票不同。是的话，疑点降为提示。第一次要等十几秒到一分钟。";
    if (status.model === "missing") { text = "这台电脑上没有模型（" + status.model_note + "）。措施换了说法时可能被报成“缺少”，请人工排除。"; }
    if (status.model === "failed") { text = "这次没有用成：" + status.model_note + "。措施换了说法时可能被报成“缺少”。重新打开票审会再试。"; }
    if (status.model === "ready") { text = "规则报了“可能缺少措施”才做。模型已经启动，每张票十几秒以内。"; }
    setText($("how-model"), text);
  }

  // ---------- 流水线 ----------
  function layout() {
    var height = (window.innerHeight || document.documentElement.clientHeight) - $("bar").offsetHeight - document.querySelector(".top").offsetHeight;
    var many = jobs.length > 1;
    $("list").style.display = many ? "block" : "none";
    $("list").style.height = height + "px";
    $("pane").className = many ? "with-list" : "";
    var rest = height - $("steps").offsetHeight - 44;
    $("frame").style.height = (rest < 240 ? 240 : rest) + "px";
  }
  window.onresize = function () { if (view === "results") { layout(); } };

  function setStep(id, state, title, detail) {
    var box = $(id);
    box.className = "step " + state;
    setText(box.getElementsByTagName("b")[0], title);
    setText(box.getElementsByTagName("span")[0], detail);
  }

  function countText(result) {
    if (result.level === "no_scenario") { return "没有找到对应的典票场景"; }
    if (result.issues === 0 && result.notes === 0) { return "没有发现疑点"; }
    var parts = [];
    if (result.issues > 0) { parts.push(result.issues + " 处疑点"); }
    if (result.notes > 0) { parts.push(result.notes + " 条提示"); }
    return "发现 " + parts.join("，");
  }

  function drawSteps(job) {
    var rule = job.rule, last = job.final;
    if (job.state === "waiting") {
      setStep("step1", "", "排队中", ""); setStep("step2", "", "—", ""); setStep("step3", "", "—", ""); return;
    }
    if (job.state === "failed") {
      setStep("step1", "bad", "没能预审", "见下方原因"); setStep("step2", "", "—", ""); setStep("step3", "", "—", ""); return;
    }
    if (job.state === "rule") {
      setStep("step1", "doing", "正在检查…", ""); setStep("step2", "", "—", ""); setStep("step3", "", "—", ""); return;
    }
    setStep("step1", "ok", countText(rule), rule.pending > 0 ? "其中 " + rule.pending + " 处是“可能缺少措施”，交给第二步复核" : "没有“可能缺少措施”的事项");
    if (job.state === "model") {
      if (rule.pending === 0) { setStep("step2", "doing", "…", ""); } else {
        setStep("step2", "doing", "正在复核… " + job.seconds + " 秒",
          modelState === "ready" ? "逐条比对票面上同一栏的措施" : "第一次要启动模型，十几秒到一分钟。请不要关掉那个黑色的窗口");
      }
      setStep("step3", "", "—", "等第二步");
      return;
    }
    var end = last || rule;
    if (job.modelError) {
      setStep("step2", "bad", "没有做成", job.modelError + "。结论只用了规则");
    } else if (last.model === "failed") {
      setStep("step2", "bad", "没有做成", last.model_note + "。结论只用了规则，措施换了说法可能被报成缺少");
    } else if (rule.pending === 0) {
      setStep("step2", "skip", "不需要", "规则没有报“可能缺少措施”，没有启动模型");
    } else if (last.reworded > 0) {
      setStep("step2", "ok", "降了 " + last.reworded + " 处", "复核了 " + rule.pending + " 处，认为 " + last.reworded + " 处票面上其实写了、只是写法不同，已从疑点降为提示");
    } else {
      setStep("step2", "ok", "维持原判", "复核了 " + rule.pending + " 处，没有发现只是写法不同的");
    }
    var need = end.issues > 0 ? "需要你看的疑点 " + end.issues + " 处" + (end.notes > 0 ? "，另有 " + end.notes + " 条提示" : "")
      : end.notes > 0 ? "有 " + end.notes + " 条提示请过目" : "机器只查了报告清单里的项目，其余请人工审核";
    setStep("step3", end.level, end.headline, need);
  }

  function stateLine(job) {
    if (job.state === "waiting") { return "排队中"; }
    if (job.state === "rule") { return "规则检查中…"; }
    if (job.state === "model") { return job.rule.pending > 0 ? "模型复核中… " + job.seconds + " 秒" : "规则检查中…"; }
    if (job.state === "failed") { return "没能预审"; }
    return (job.final || job.rule).headline;
  }

  function drawList() {
    var box = $("list");
    box.innerHTML = "";
    for (var i = 0; i < jobs.length; i++) {
      var job = jobs[i];
      var level = job.state === "done" ? (job.final || job.rule).level : job.state === "failed" ? "failed" : "";
      var item = el("div", "item " + level + (i === selected ? " sel" : ""));
      item.setAttribute("data-index", String(i));
      item.appendChild(el("b", "", job.name));
      item.appendChild(el("span", "", stateLine(job)));
      item.onclick = function () { select(Number(this.getAttribute("data-index"))); };
      box.appendChild(item);
    }
  }

  function showReport(path) {
    show("message", false); show("frame", true);
    if ($("frame").getAttribute("data-shown") !== path) {
      $("frame").setAttribute("data-shown", path);
      $("frame").src = path;
    }
  }

  function select(index) {
    selected = index;
    var job = jobs[index];
    var result = job.final || job.rule;
    $("open").style.display = result ? "" : "none";
    setText($("saved"), job.state === "done" ? "报告已保存：" + result.saved : "");
    drawSteps(job);
    if (result) {
      showReport(result.report);
    } else {
      $("frame").setAttribute("data-shown", "");
      show("frame", false); show("message", true);
      $("message").innerHTML = "";
      if (job.state === "failed") {
        $("message").appendChild(el("h2", "", "这张票没能预审"));
        $("message").appendChild(el("p", "", job.error));
        $("message").appendChild(el("p", "muted", "常见原因：粘贴的不是完整的票面（要从“编号”一直到表格结束）；或者这不是配电第一种工作票。"));
      } else {
        $("message").appendChild(el("p", "muted", job.state === "waiting" ? "前面的票审完就轮到它。" : "马上就好。"));
      }
    }
    drawList();
    layout();
  }

  function refresh(index) { if (selected === index) { select(index); } else { drawList(); } }

  function runNext() {
    var index = -1;
    for (var i = 0; i < jobs.length; i++) { if (jobs[i].state === "waiting") { index = i; break; } }
    if (index < 0) { clearInterval(timer); timer = null; $("again").disabled = false; return; }
    var job = jobs[index];
    job.state = "rule";
    if (selected < 0 || jobs[selected].state !== "done") { select(index); } else { drawList(); }
    call("POST", "check", {name: job.name, text: job.text, stage: "rule"}, function (rule) {
      if (!rule.ok) { job.state = "failed"; job.error = rule.error; refresh(index); runNext(); return; }
      job.rule = rule;
      job.state = "model";
      job.seconds = 0;
      refresh(index);
      call("POST", "check", {name: job.name, text: job.text, stage: "full"}, function (last) {
        if (last.ok) {
          job.final = last;
          if (rule.pending > 0) { modelState = last.model === "done" ? "ready" : "failed"; }
        } else { job.modelError = last.error; }
        job.state = "done";
        refresh(index);
        runNext();
      });
    });
  }

  // 粘贴的票用票号起名，免得几张粘贴的票的报告互相覆盖
  function pastedName(text) {
    var found = /编号[:：][ \t　]*([^\s|\/]+)/.exec(text);
    return found ? "票号 " + found[1] : "粘贴的票面";
  }

  $("go").onclick = function () {
    jobs = [];
    var pasted = $("text").value;
    if (pasted.replace(/\s/g, "")) { jobs.push({name: pastedName(pasted), text: pasted}); }
    for (var i = 0; i < files.length; i++) { jobs.push({name: files[i].name, text: files[i].text}); }
    for (var k = 0; k < jobs.length; k++) { jobs[k].state = "waiting"; jobs[k].seconds = 0; }
    selected = -1;
    $("again").disabled = true;
    showView("results");
    timer = setInterval(function () {
      for (var j = 0; j < jobs.length; j++) {
        if (jobs[j].state === "model") { jobs[j].seconds += 1; if (j === selected) { drawSteps(jobs[j]); } }
      }
      drawList();
    }, 1000);
    runNext();
  };

  $("again").onclick = function () {
    files = []; $("text").value = ""; drawFiles(); fileError("");
    $("frame").setAttribute("data-shown", ""); $("frame").src = "about:blank";
    showView("input");
    call("GET", "status", null, function (status) { if (status.version) { applyStatus(status); } });
  };
  $("open").onclick = function () {
    var job = selected >= 0 ? jobs[selected] : null;
    var result = job ? (job.final || job.rule) : null;
    if (result) { window.open(result.report, "_blank"); }
  };

  // ---------- 准确度 ----------
  function percent(hit, total) { return total > 0 ? (Math.round(hit * 1000 / total) / 10) + "%" : "—"; }

  function meterRow(row) {
    var tr = el("tr");
    tr.appendChild(el("td", "name", row.name));
    var middle = el("td");
    var track = el("div", "track");
    var fill = el("div", "fill" + (row.want === "zero" ? " wrong" : ""));
    fill.style.width = (row.total > 0 ? row.hit * 100 / row.total : 0) + "%";
    track.appendChild(fill);
    track.title = row.name + "：" + row.hit + " / " + row.total + "（" + percent(row.hit, row.total) + "）";
    middle.appendChild(track);
    tr.appendChild(middle);
    var figure = el("td", "figure");
    figure.appendChild(el("b", "", row.hit + " / " + row.total));
    figure.appendChild(el("small", "", row.want === "zero" && row.hit === 0 ? "一道没有" : percent(row.hit, row.total)));
    tr.appendChild(figure);
    return tr;
  }

  function drawAccuracy(data) {
    var body = $("accuracy-body");
    body.innerHTML = "";
    if (!data.sections) {
      var failed = el("div", "card");
      failed.appendChild(el("p", "", "成绩单没有读出来：" + (data.error || "文件里没有内容")));
      body.appendChild(failed);
      return;
    }
    setText($("accuracy-meta"), "实测日期：" + data.measured + "。考题是用典票改出来的，不是真实工作票。");
    for (var i = 0; i < data.sections.length; i++) {
      var section = data.sections[i];
      var card = el("div", "card");
      card.appendChild(el("h2", "", section.title));
      card.appendChild(el("p", "muted", "考题：" + section.exam));
      var table = el("table", "meters");
      var tbody = el("tbody");
      for (var k = 0; k < section.rows.length; k++) {
        tbody.appendChild(meterRow(section.rows[k]));
        if (section.rows[k].note) {
          var note = el("tr", "note");
          var cell = el("td", "", section.rows[k].note);
          cell.colSpan = 3;
          note.appendChild(cell);
          tbody.appendChild(note);
        }
      }
      table.appendChild(tbody);
      card.appendChild(table);
      body.appendChild(card);
    }
    var limits = el("div", "card");
    limits.appendChild(el("h2", "", "这些数字不能说明什么"));
    var list = el("ul", "plain");
    for (var j = 0; j < data.caveats.length; j++) { list.appendChild(el("li", "", data.caveats[j])); }
    limits.appendChild(list);
    body.appendChild(limits);
  }

  function loadAccuracy() {
    if (accuracyLoaded) { return; }
    accuracyLoaded = true;
    call("GET", "accuracy", null, drawAccuracy);
  }

  $("quit").onclick = function () {
    call("POST", "quit", {}, function () {
      gone("票审已退出", "可以关掉这个页面了。已经生成的报告还在“报告”文件夹里。要再用，重新双击“票审.exe”。");
    });
  };

  call("GET", "status", null, function (status) {
    if (!status.version) { gone("主界面没能启动", status.error || "请重新双击“票审.exe”。"); return; }
    applyStatus(status);
    refreshGo();
  });
  call("GET", "examples", null, function (list) { if (list && list.length) { drawExamples(list); } });
})();
</script>
</body>
</html>
