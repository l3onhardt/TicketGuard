[workspace]
resolver = "2"
members = ["rust/ticketguard", "rust/tg", "rust/tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
ticketguard = { path = "rust/ticketguard" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip：浮点数读写精确到最后一位（默认的快速解析可能差 1 个最低位）
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
fancy-regex = "0.13"
once_cell = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
